name: Build Wheels [Windows]

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download prebuilt vcpkg deps
        run: |
          curl -L -o vcpkg-deps.tar.gz https://github.com/unaLoo/enc2db/releases/download/prebuilt-deps-v1/vcpkg-x64-windows.tar.gz
          New-Item -ItemType Directory -Force -Path C:/vcpkg/installed
          tar -xzf vcpkg-deps.tar.gz -C C:/vcpkg/installed/

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-build-core pybind11

      - name: Get pybind11 cmake dir
        id: pybind11
        run: |
          $dir = python -c "import pybind11; print(pybind11.get_cmake_dir())"
          echo "cmake_dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Build pyd
        run: |
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -Dpybind11_DIR="${{ steps.pybind11.outputs.cmake_dir }}"
          cmake --build . --config Release

      - name: Package wheel
        run: |
          $pybind11_dir = python -c "import pybind11; print(pybind11.get_cmake_dir())"
          $env:SKBUILD_CMAKE_ARGS = "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake;-Dpybind11_DIR=$pybind11_dir"
          python -c "import scikit_build_core.build; scikit_build_core.build.build_wheel('dist')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-cp${{ matrix.python-version }}
          path: dist/*.whl

  publish:
      needs: build
      runs-on: ubuntu-latest
      if: startsWith(github.ref, 'refs/tags/v')

      steps:
        - name: Download all wheels
          uses: actions/download-artifact@v4
          with:
            path: dist/
            merge-multiple: true

        - name: Publish to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
          with:
            password: ${{ secrets.PYPI_API_TOKEN }}