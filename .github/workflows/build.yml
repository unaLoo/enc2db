name: Build Wheels [Windows]

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install vcpkg headers only
        run: |
          vcpkg install gdal:x64-windows sqlite3:x64-windows geos:x64-windows libspatialite:x64-windows --only-downloads
          vcpkg install gdal:x64-windows sqlite3:x64-windows geos:x64-windows libspatialite:x64-windows --head

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-build-core pybind11

      - name: Get pybind11 cmake dir
        id: pybind11
        run: |
          $dir = python -c "import pybind11; print(pybind11.get_cmake_dir())"
          echo "cmake_dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Build pyd
        run: |
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -Dpybind11_DIR="${{ steps.pybind11.outputs.cmake_dir }}"
          cmake --build . --config Release

      - name: Copy prebuilt DLLs into package
        run: |
          copy prebuilt\windows-x64\*.dll enc2db\
          copy build\Release\*.pyd enc2db\

      - name: Package wheel
        run: |
          python -c "import scikit_build_core.build; scikit_build_core.build.build_wheel('dist')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-cp${{ matrix.python-version }}
          path: dist/*.whl