name: Build Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install vcpkg dependencies
        run: |
          vcpkg install gdal:x64-windows sqlite3:x64-windows geos:x64-windows libspatialite:x64-windows
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-build-core pybind11

      - name: Get pybind11 cmake dir
        id: pybind11
        run: |
          $dir = python -c "import pybind11; print(pybind11.get_cmake_dir())"
          echo "cmake_dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Build wheel
        run: |
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -Dpybind11_DIR="${{ steps.pybind11.outputs.cmake_dir }}"
          cmake --build . --config Release
          cd ..
          python -c "import scikit_build_core.build; scikit_build_core.build.build_wheel('dist')"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-cp${{ matrix.python-version }}
          path: dist/*.whl